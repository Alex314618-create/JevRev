name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node 20 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Verify linked CLI
        run: |
          npm link
          jevrev --version
      - run: npm run demo
      - run: npm run demo:workflow
      - run: npm run demo:loop
      - run: npm run demo:engineering
      - name: Verify archived developer evidence
        run: node scripts/verify-developer-trial.mjs
      - name: Run isolated developer workflow smoke
        run: node scripts/run-developer-smoke.mjs
      - name: Retain developer smoke traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: developer-smoke-${{ matrix.os }}
          path: benchmarks/results/developer-smoke/
          if-no-files-found: ignore
          retention-days: 14
